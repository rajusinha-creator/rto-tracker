<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>B2C Vehicle Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#f6f4ec;font-family:system-ui,sans-serif;color:#1f2d36}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  .cover{position:fixed;inset:0;background:#f6f4ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .cover img{width:100px;height:100px}
  #help{display:none;flex-direction:column;align-items:center;gap:12px;font-size:14px}
  a,button{display:inline-block;border:0;background:#ffc400;color:#111;font:700 15px system-ui,sans-serif;text-decoration:none;padding:13px 28px;border-radius:8px}
</style>
</head>
<body>
<iframe id="app" title="B2C Vehicle Tracker"></iframe>
<div class="cover" id="cover">
  <img src="icon-192.png" alt="">
  <strong>Loading…</strong>
  <div id="help">
    <p>Taking too long? Check the network. First time on this device, sign in with your company account, close that page, then tap Retry.</p>
    <a id="signin" target="_blank">Sign in</a>
    <button onclick="location.reload()">Retry</button>
  </div>
</div>
<script>
const APP_URL = 'https://script.google.com/a/macros/purplle.com/s/AKfycbw2KGHV2ajA8Hf_6RxlVd6cib09K0Cy9FfZzZLf3SPz-3lrdV9zopEVC7TfQRAf2GRTuQ/exec';

const $ = id => document.getElementById(id);
window.addEventListener('message', e => {
  if (e.data === 'rto-ready' && new URL(e.origin).hostname.endsWith('.googleusercontent.com')) $('cover').style.display = 'none';
});
$('signin').href = APP_URL;
$('app').src = APP_URL;
setTimeout(() => $('help').style.display = 'flex', 8000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
